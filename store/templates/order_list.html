{% extends 'base.html' %}

{% block title %}Менің тапсырыстарым{% endblock %}

{% block content %}
<h2 class="mb-4">Менің тапсырыстарым</h2>

{% if orders %}
    <ul class="list-group">
        {% for order in orders %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span>{{ order.product.name }}</span>
            <a href="{% url 'order_detail' order.id %}" class="btn btn-sm btn-outline-primary">Толығырақ</a>
        </li>
        {% endfor %}
    </ul>
{% else %}
    <div class="alert alert-warning mt-3">Сізде тапсырыстар жоқ.</div>
{% endif %}
{% endblock %}
